# NeuraQuill-100M: Phase 10's scale-up target. Reuses the SAME tokenizer
# as the 10M model (tokenizer/artifacts, vocab_size=8192) -- the point of
# this phase is that the tokenizer/model/training code scales via config
# alone, not that everything needs retraining from zero. 98.8M params.
vocab_size: 8192
block_size: 512
n_layer: 13
n_head: 12
n_embd: 768
dropout: 0.0
bias: true
